[package]
name = "ytmusic-rs"
version = "0.1.0"
edition = "2021"
description = "Native YouTube Music desktop client in Rust"

[dependencies]
eframe = { version = "0.31", features = ["default"] }
egui = "0.31"
rodio = { version = "0.20", features = ["symphonia-all"] }
reqwest = { version = "0.12", features = ["json", "stream", "cookies", "blocking"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
dirs = "6"
log = "0.4"
env_logger = "0.11"
souvlaki = "0.8"
tray-icon = { version = "0.25", default-features = false, features = ["libappindicator"] }
